services:
  - type: web
    name: agrimart-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true          # Render auto-generates a secure random value
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./agrimart.db
      - key: CORS_ORIGINS
        value: '["https://your-frontend.onrender.com","capacitor://localhost","http://localhost"]'
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: DEBUG_OTP
        value: "false"
      - key: PRICE_REFRESH_INTERVAL_SECONDS
        value: "30"
      - key: SMS_PROVIDER
        value: twilio
      - key: TWILIO_ACCOUNT_SID
        value: ""
      - key: TWILIO_AUTH_TOKEN
        value: ""
      - key: TWILIO_FROM_NUMBER
        value: ""
      - key: MSG91_AUTH_KEY
        value: ""
      - key: MSG91_TEMPLATE_ID
        value: ""
      - key: MSG91_FLOW_ID
        value: ""
      - key: ADMIN_API_KEY
        generateValue: true
      - key: ADMIN_MOBILE
        value: ""
      - key: ADMIN_PASSWORD
        value: ""
      - key: ADMIN_NAME
        value: AgriMart Admin
      - key: REDIS_URL
        value: ""
